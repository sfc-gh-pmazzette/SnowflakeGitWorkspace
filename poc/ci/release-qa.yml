# Phase 2 (optional): copy to .github/workflows/release-qa.yml in the repo.
# Pushing a tag v* releases it to QA with the SAME procedure used in
# poc/sql/20_release_to_qa.sql - nothing else changes between manual and CI.
#
# Repository secrets required:
#   SNOWFLAKE_ACCOUNT      account identifier (e.g. <org>-<account>)
#   SNOWFLAKE_USER         service user with role AGENT_POC_RELEASE_ROLE
#   SNOWFLAKE_PRIVATE_KEY  that user's private key (key-pair auth, PEM)
name: release-agent-qa

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)release to QA, e.g. v1.0 (use an older tag to roll back)'
        required: true

concurrency: release-sales-agent-qa      # never two releases of the same agent at once

jobs:
  release-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: snowflakedb/snowflake-cli-action@v1
        with:
          default-config-file-path: ''
      - name: Release tag to QA
        env:
          SNOWFLAKE_CONNECTIONS_CI_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_CONNECTIONS_CI_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_CONNECTIONS_CI_AUTHENTICATOR: SNOWFLAKE_JWT
          SNOWFLAKE_CONNECTIONS_CI_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_CONNECTIONS_CI_ROLE: AGENT_POC_RELEASE_ROLE
          SNOWFLAKE_CONNECTIONS_CI_WAREHOUSE: SNOWFLAKE_LEARNING_WH
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid tag: $RELEASE_TAG"; exit 1; }
          snow sql -c ci -q "CALL AGENT_POC_OPS.RELEASE.RELEASE_AGENT('SALES_AGENT', '${RELEASE_TAG}', 'QA', 'qa', TRUE)"
          snow sql -c ci -q "SHOW VERSIONS IN AGENT AGENT_POC_QA.SALES.SALES_AGENT"
